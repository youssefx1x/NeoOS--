---
# Calamares settings.conf for NeoOS.
# The module list is Debian-compatible; branding is NeoOS.
# "local" is LIBDIR/calamares/modules (multiarch on Debian).

# Module directory locations.
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - packages
  - initramfscfg
  - initramfs
  - umount

- show:
  - finished

branding: neoos
prompt-install: false
dont-chroot: false
