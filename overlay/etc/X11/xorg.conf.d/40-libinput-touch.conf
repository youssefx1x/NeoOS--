# libinput input-device tuning for NeoOS.
# Enables tap-to-click, natural scrolling and disable-while-typing for
# touchpads and touchscreens — useful for mobile/proot display sessions.
Section "InputClass"
    Identifier "touchpad tap/scroll"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "on"
    Option "DisableWhileTyping" "on"
    Option "ClickMethod" "clickfinger"
    Option "TappingButtonMap" "lmr"
EndSection

Section "InputClass"
    Identifier "touchscreen tap"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
EndSection
