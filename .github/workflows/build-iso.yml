name: Build NeoOS ISO

# Builds a bootable NeoOS ISO (with XFCE + auto-login + installer) for x86_64
# and attaches it to a GitHub Release. Triggered by pushing a versioned tag
# (e.g. `1.1.1`), or manually from the Actions tab.

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 1.1.1)'
        required: false
        default: '1.1.1'

permissions:
  contents: write
  packages: write

env:
  NEOS_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build-amd64-iso:
    name: Build NeoOS ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Install current Debian archive keyring (trixie signing keys)
        run: |
          set -e
          deb=$(curl -fsSL https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ | grep -oE 'debian-archive-keyring_[0-9][^"]*_all.deb' | sort -V | tail -1)
          curl -fsSL "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$deb" -o /tmp/debian-archive-keyring.deb
          sudo apt-get install -y /tmp/debian-archive-keyring.deb
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mmdebstrap debootstrap xz-utils \
            squashfs-tools grub-efi-amd64 grub2-common grub-common \
            xorriso mtools dosfstools
      
      - name: Build rootfs (amd64)
        run: |
          sudo env NEOS_ARCH=amd64 NEOS_VARIANT=full bash ./build.sh rootfs
          ls -lh build/rootfs/usr/bin/bash
      
      - name: Build ISO (amd64)
        run: |
          sudo env NEOS_ARCH=amd64 bash ./scripts/build-iso.sh
          ls -lh build/neoos.iso
      
      - name: Verify ISO
        run: |
          file build/neoos.iso
          ls -lh build/neoos.iso
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoos-amd64-iso
          path: build/neoos.iso

  build-arm64-iso:
    name: Build NeoOS ISO (arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      
      - name: Install current Debian archive keyring (trixie signing keys)
        run: |
          set -e
          deb=$(curl -fsSL https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ | grep -oE 'debian-archive-keyring_[0-9][^"]*_all.deb' | sort -V | tail -1)
          curl -fsSL "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$deb" -o /tmp/debian-archive-keyring.deb
          sudo apt-get install -y /tmp/debian-archive-keyring.deb
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mmdebstrap debootstrap xz-utils \
            squashfs-tools grub-efi-arm64 grub2-common grub-common \
            xorriso mtools dosfstools \
            qemu-user-static
      
      - name: Build rootfs (arm64)
        run: |
          sudo env NEOS_ARCH=arm64 bash ./scripts/build-rootfs.sh
          ls -lh build/rootfs/usr/bin/bash
      
      - name: Build ISO (arm64)
        run: |
          sudo env NEOS_ARCH=arm64 NEOS_INCLUDE_INSTALLER=0 bash ./scripts/build-iso.sh
          ls -lh build/neoos.iso
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoos-arm64-iso
          path: build/neos.iso

  publish:
    name: Create GitHub Release
    needs: [build-amd64-iso, build-arm64-iso]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoOS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/neoos-amd64-iso/neoos.iso
            artifacts/neoos-arm64-iso/neoos.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
